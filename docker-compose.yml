networks:
  gateway:
    external: true

services:
  nametool-python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nametool-python-service
    ports:
      - "127.0.0.1:8009:8009"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FLASK_ENV=development  # 開發模式
    volumes:
      - ../taicol-2021/public/pdfs:/pdfs
      - ../taicol-2021/public/usage_results:/usage_results
      - ./prompts:/prompts
      - .:/app  # 掛載整個原始碼目錄
    command: python main.py  # 覆寫啟動指令
    deploy:
      resources:
        limits:
          memory: 512M  # 給予較大的爆發空間
        reservations:
          memory: 128M  # 平時保留 128M 給它
    networks:
      - gateway